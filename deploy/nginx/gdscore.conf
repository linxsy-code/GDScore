server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name gd.spacy.top;

    root /var/www/gdscore;
    index index.html;

    # Replace these paths if your certificate is stored elsewhere.
    ssl_certificate /etc/letsencrypt/live/gd.spacy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gd.spacy.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GDScoreSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/gdscore.access.log;
    error_log /var/log/nginx/gdscore.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Hashed Vite assets are safe to cache for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # Browsers must revalidate the app shell and service worker on every visit.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    location = /registerSW.js {
        default_type application/javascript;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # SPA fallback keeps direct visits and refreshes working.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
